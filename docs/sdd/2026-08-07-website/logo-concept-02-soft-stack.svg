  <title id="title">Agentworks soft-stack AGW rocket monogram</title>
  <desc id="description">
    The letters A, G, and W overlap to form a rocket. The G has a rounded body with square
    terminals, while the A forms the nosecone and the W forms two engines.
  </desc>

