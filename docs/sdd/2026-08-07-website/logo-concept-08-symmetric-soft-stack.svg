<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 240 425"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Agentworks symmetric soft-stack AGW rocket monogram</title>
  <desc id="description">
    Custom A, G, and W shapes form a connected rocket. The G has four matching rounded corners; only
    its right-side opening and inward stroke break the symmetry of an O.
  </desc>

