name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check agentworks/ tests/

      - name: Ruff format check
        run: uv run ruff format --check agentworks/ tests/

      - name: Mypy
        run: uv run mypy agentworks/ tests/

      - name: Check typer isolation
        run: |
          # Business logic must not import typer; use the output module instead.
          # Allowed: cli/ package (CLI layer), completions/ (CLI layer),
          # sessions/manager/_logs.py (raw data pipe, see comment in file).
          violations=$(grep -rnP '^\s*(import typer|from typer)' agentworks/ --include='*.py' \
            | grep -v '__pycache__' \
            | grep -v 'agentworks/cli/' \
            | grep -v 'completions/' \
            | grep -v 'sessions/manager/_logs\.py' \
            || true)
          if [ -n "$violations" ]; then
            echo "ERROR: typer imported in business logic (use agentworks.output instead):"
            echo "$violations"
            exit 1
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pytest
        run: uv run pytest tests/ -m 'not integration'

  # File-quality linters and the rulesync drift check both run via the same
  # scripts contributors use locally (./scripts/lint-files.sh, ./scripts/rulesync-upgen.sh
  # --check). That keeps CI and local behavior in lockstep; the version pins,
  # ignore lists, and exit semantics are defined exactly once.

  lint-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: ./scripts/lint-files.sh
        run: ./scripts/lint-files.sh

  rulesync-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: ./scripts/rulesync-upgen.sh --check
        run: ./scripts/rulesync-upgen.sh --check

  locked-sdds:
    runs-on: ubuntu-latest
    steps:
      # Full history so the merge-base with the base branch is reachable; the
      # check compares against where this branch diverged from main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # For PRs, check out the head commit (not the synthetic merge commit)
          # so merge-base against the base ref is meaningful. Empty on push.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Determine base ref
        id: base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: ./scripts/check-locked-sdds.sh
        run: ./scripts/check-locked-sdds.sh "${{ steps.base.outputs.ref }}"

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - name: Check out source commit
        uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Python website tests
        run: python3 -m unittest discover -s website/tests -p 'test_*.py'

      - name: Node website model tests
        run: node --test website/tests/lander-world.test.mjs website/tests/lander-model.test.mjs website/tests/lander-phase4i.test.mjs website/tests/lander-phase4j.test.mjs website/tests/lander-phase4k.test.mjs website/tests/lander-phase4l.test.mjs

      - name: Verify deterministic full builds
        run: |
          python3 website/build.py --repo-root . --output "${RUNNER_TEMP}/site-root-a" --site-base /
          python3 website/build.py --repo-root . --output "${RUNNER_TEMP}/site-root-b" --site-base /
          diff --recursive --no-dereference "${RUNNER_TEMP}/site-root-a" "${RUNNER_TEMP}/site-root-b"
          python3 website/build.py --repo-root . --output "${RUNNER_TEMP}/site-project-a" --site-base /agentworks/
          python3 website/build.py --repo-root . --output "${RUNNER_TEMP}/site-project-b" --site-base /agentworks/
          diff --recursive --no-dereference "${RUNNER_TEMP}/site-project-a" "${RUNNER_TEMP}/site-project-b"

  # Umbrella job: require this single check in branch protection on main.
  # Adding a new job to CI means adding it to `needs:` below, so the
  # required-checks list lives in the workflow file (alongside the jobs)
  # rather than in GitHub settings that can drift silently.
  ci-success:
    if: always()
    needs: [python-checks, test, lint-files, rulesync-drift, locked-sdds, website]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        env:
          REQUIRED_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -r -a results <<< "$REQUIRED_RESULTS"
          if [[ "${#results[@]}" -ne 6 ]]; then
            echo "::error::Expected six required CI job results."
            exit 1
          fi
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required CI job ended with non-success result: $result."
              exit 1
            fi
          done
          echo "All required CI jobs passed."
