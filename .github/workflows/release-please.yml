name: Release Please

on:
  push:
    # Maintenance branches (0.15.x, 0.16.x, ...) release alongside main. Each
    # branch carries its own manifest, so each computes its own next version:
    # a branch cut from a release tag with only fix commits produces a patch.
    branches: [main, "[0-9]+.[0-9]+.x"]

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr_branch: ${{ steps.extract.outputs.pr_branch }}
    steps:
      # Use a GitHub App token so the release PR (and any subsequent pushes
      # to its branch) trigger CI workflows. The default GITHUB_TOKEN creates
      # events as github-actions[bot], which GitHub won't run workflows for.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Release against the branch that triggered this run, so one workflow
          # serves main and every maintenance branch without further edits.
          target-branch: ${{ github.ref_name }}

      - name: Extract release PR branch
        id: extract
        if: steps.release.outputs.pr
        # Pass the PR JSON through the environment, not inline interpolation. The
        # release-notes body contains shell metacharacters (parens in markdown
        # links, quotes, backticks), so inlining `${{ steps.release.outputs.pr }}`
        # into the script breaks parsing (and is a script-injection vector). As an
        # env var the shell treats it as one opaque string; jq parses the JSON.
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r .headBranchName <<<"$RELEASE_PR")
          echo "pr_branch=$branch" >> "$GITHUB_OUTPUT"

  sync-lockfile:
    # release-please bumps cli/pyproject.toml's version but leaves the matching
    # entry in cli/uv.lock stale. Re-lock on the release PR branch so the
    # lockfile bump lands in the same PR. See issue #49.
    needs: release-please
    if: needs.release-please.outputs.pr_branch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Re-lock (preserves existing pins; only the workspace version moves)
        run: uv lock

      - name: Commit lockfile if changed
        run: |
          git config user.name "wf-release[bot]"
          git config user.email "wf-release[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "Lockfile already in sync"
          else
            git commit -m "chore: sync uv.lock after version bump"
            git push
          fi
