name: Release to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to re-run for (e.g. v0.14.0)"
        required: true

permissions:
  contents: read
  id-token: write # Required for trusted publishing via OIDC

jobs:
  verify-tag-on-release-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from a release branch
        # A published tag must sit on a release line rather than anywhere a
        # tag can be pushed. `main` is protected by the `protect-default`
        # ruleset; maintenance branches (0.15.x, 0.16.x, ...) are NOT, as of
        # 2026-08-27, because that ruleset targets `~DEFAULT_BRANCH` only.
        # So this accepts them on convention rather than on enforcement, and
        # anyone with write access could create `9.9.x`, push to it directly,
        # and tag it. Extending the ruleset to `[0-9]+.[0-9]+.x` with the same
        # pull_request and required_status_checks rules is what would make
        # this an enforced boundary; until then the honest description is that
        # a maintenance branch is trusted, not verified.
        run: |
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          TAG="${{ inputs.tag || github.ref_name }}"
          SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          BRANCHES="origin/main $(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
            | grep -E '^origin/[0-9]+\.[0-9]+\.x$' || true)"
          for ref in $BRANCHES; do
            if git merge-base --is-ancestor "$SHA" "$ref"; then
              echo "tag ${TAG} is reachable from ${ref}"
              exit 0
            fi
          done
          echo "Error: tag ${TAG} is not reachable from main or any maintenance branch"
          exit 1

  test:
    needs: verify-tag-on-release-branch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The package-fingerprint guard diffs against origin/main and fails
          # closed when the ref is absent, so the tag checkout must carry it.
          fetch-depth: 0

      - name: Fetch the authoritative package base ref
        run: git fetch origin main
        working-directory: .

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check agentworks/ tests/

      - name: Mypy
        run: uv run mypy agentworks/

      - name: Pytest
        run: uv run pytest tests/ -m 'not integration'

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        run: uv build --out-dir pypi-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli/pypi-dist/
