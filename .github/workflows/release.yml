name: Release to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to re-run for (e.g. v0.14.0)"
        required: true

permissions:
  contents: read
  id-token: write # Required for trusted publishing via OIDC

jobs:
  verify-tag-on-release-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from a release branch
        # A published tag must sit on a release line rather than anywhere
        # a tag can be pushed. `main` is covered by the `protect-default`
        # ruleset and maintenance branches by `protect-maintenance`, which
        # mirrors its rules against `*.*.x`, so both lines require a reviewed
        # pull request and passing checks before anything a tag can point at
        # reaches them.
        #
        # If you edit that ruleset, mind the dialect. Rulesets match with
        # fnmatch, where `+` is a literal rather than a quantifier, so the
        # `[0-9]+.[0-9]+.x` spelling `release-please.yml` uses for Actions
        # branch filters does not carry over. Character sets do work, but
        # `[0-9]` matches exactly one character, so `[0-9].[0-9].x` would
        # cover `0.1.x` and silently miss `0.15.x`. `*.*.x` errs the other
        # way: it covers every maintenance name and some non-maintenance
        # ones too, which is the safe direction for a protection rule.
        #
        # This job is one of three gates, and failing it does block a
        # publish: `test` needs this job and `publish` needs `test`. The
        # final authorization gate is the `release` environment, which is
        # what decides whether a given dispatch may publish at all. It
        # permits deployments only from refs matching `v*` of type TAG, and an
        # environment evaluates `github.ref` rather than whatever a job checks
        # out. So run the dispatch input below with "Use workflow from" set to
        # the tag itself: that satisfies the policy and re-runs that tag's own
        # workflow, which is what you want for a transient failure. Running a
        # NEWER workflow against an OLDER tag is what the policy prevents, and
        # it requires a temporary deployment-policy exception; prefer cutting
        # a new patch tag that carries the corrected workflow.
        run: |
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
          TAG="${{ inputs.tag || github.ref_name }}"
          SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          BRANCHES="origin/main $(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
            | grep -E '^origin/[0-9]+\.[0-9]+\.x$' || true)"
          for ref in $BRANCHES; do
            if git merge-base --is-ancestor "$SHA" "$ref"; then
              echo "tag ${TAG} is reachable from ${ref}"
              exit 0
            fi
          done
          echo "Error: tag ${TAG} is not reachable from main or any maintenance branch"
          exit 1

  test:
    needs: verify-tag-on-release-branch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The package-fingerprint guard diffs against origin/main and fails
          # closed when the ref is absent, so the tag checkout must carry it.
          fetch-depth: 0

      - name: Fetch the authoritative package base ref
        run: git fetch origin main
        working-directory: .

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check agentworks/ tests/

      - name: Mypy
        run: uv run mypy agentworks/

      - name: Pytest
        run: uv run pytest tests/ -m 'not integration'

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        run: uv build --out-dir pypi-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: cli/pypi-dist/
