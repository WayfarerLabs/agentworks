<section id="lander-game" aria-label="Lunar deployment scene">
    <div id="lander-scene-shell" tabindex="-1">
        <svg
            id="lander-scene"
            viewBox="0 0 1000 640"
            preserveAspectRatio="xMidYMid meet"
            role="img"
            aria-labelledby="lander-scene-title lander-scene-description"
        >
            <title id="lander-scene-title">Lunar deployment scene</title>
            <desc id="lander-scene-description">
                An AGW lander hovers above a varied lunar surface, an elevated helipad with a gas can, and a dark
                network operations center.
            </desc>
            <rect id="scene-sky" width="1000" height="640" />
            <path id="scene-stars" d="M90 98h2m122-31h2m235 63h2m198-48h2m173 91h2" />
            <g id="lander-world" aria-hidden="true">
                <g id="terrain-layer">
                    <path
                        class="terrain-chunk"
                        data-chunk-index="0"
                        d="M0 509.342L40 495.556L80 513.77L120 493.985L160 508.199L200 500.413L240 515.011L280 497.609L312 504.804L408 504.804L440 524.097L480 502.791L520 519.486L560 502.18L600 506.875L640 493.828L680 512.78L720 493.733L760 508.685L800 501.638L840 489.091L880 508.544L920 489.997L960 505.45L1000 498.902L1000 648L0 648Z"
                    />
                </g>
                <g id="site-layer">
                    <g class="lander-site" data-site-id="0" data-can="present" data-power="off" data-noc-stage="0">
                        <rect class="landing-platform" x="312" y="496.804" width="96" height="3.5" />
                        <path class="helipad-mark" d="M351 498.5v-20m18 20v-20m-18 10h18" />
                        <path class="platform-supports" d="M326 500.304v4.5m68-4.5v4.5" />
                        <path
                            class="gas-can"
                            transform="translate(390 482)"
                            d="M-7 0h14v15H-7Zm4-5h7v5h-7Zm10 7h4v8H7"
                        />
                        <path class="noc-building" d="M428 516.862V424.804h70v92.058Z" />
                        <path class="noc-building noc-entry" d="M428 479h13v18h-13Z" />
                        <g class="noc-battery">
                            <rect x="441" y="443" width="40" height="22" rx="2" />
                            <path class="battery-terminal" d="M481 449h5v10h-5" />
                            <path class="battery-bar battery-bar-1" d="M446 448h5v12h-5Z" />
                            <path class="battery-bar battery-bar-2" d="M454 448h5v12h-5Z" />
                            <path class="battery-bar battery-bar-3" d="M462 448h5v12h-5Z" />
                            <path class="battery-bar battery-bar-4" d="M470 448h5v12h-5Z" />
                        </g>
                        <path class="noc-antenna antenna-mast" d="M463 424.804v-32" />
                        <circle class="noc-antenna antenna-head" cx="463" cy="391" r="4" />
                        <path
                            class="noc-antenna antenna-signal"
                            d="M472 387a15 15 0 0 1 0 16m8-24a26 26 0 0 1 0 32"
                        />
                    </g>
                </g>
                <g id="debris-layer"></g>
                <g id="mission-lander">
                    <use id="mission-left-engine" href="{{SITE_BASE}}assets/agw-rocket.svg#agw-engine-left" />
                    <use id="mission-right-engine" href="{{SITE_BASE}}assets/agw-rocket.svg#agw-engine-right" />
                    <use id="mission-mark" href="{{SITE_BASE}}assets/agw-rocket.svg#agw-mark" />
                    <path id="mission-bay-lip" d="M126 248h52v12h-52" />
                </g>
                <g id="mission-agent">
                    <rect x="-5" y="-9" width="10" height="11" rx="1" />
                    <path d="M-3 2v7m6-7v7M-2-5l2 2-2 2m3 0h2" />
                </g>
            </g>
            <g id="crash-flash" aria-hidden="true"><ellipse cx="0" cy="0" rx="16" ry="9" /></g>
            <g id="next-site-cue" aria-hidden="true" transform="translate(932 280)">
                <path d="M0 14h24V4l20 18-20 18V30H0Z" />
            </g>
        </svg>
        <button id="lander-start" type="button" hidden disabled aria-label="Start lunar deployment mission"></button>
    </div>
    <p id="lander-fuel" hidden>
        <span id="lander-fuel-label">Fuel reserve</span>:
        <output id="lander-fuel-value" aria-labelledby="lander-fuel-label">0.0</output>
    </p>
    <span id="lander-target-direction" class="visually-hidden" hidden>Next site is to the right.</span>
    <p id="lander-controls" hidden>
        Thrust: Space or Up. Turn: Left/H or Right/L. Tap or hold to thrust; drag to turn. R restarts after a crash.
        Escape exits.
    </p>
    <div id="lander-actions" hidden>
        <button id="lander-exit" type="button">Exit mission</button>
        <button id="lander-restart" type="button" hidden disabled>Restart mission</button>
    </div>
    <p id="lander-status" role="status" aria-live="polite" aria-atomic="true"></p>
</section>
