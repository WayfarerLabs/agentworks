<section id="lander-game" aria-label="Lunar deployment scene">
    <div id="lander-scene-shell" tabindex="-1">
        <div id="lander-scene-stage">
            <svg
                id="lander-scene"
                viewBox="0 0 1000 640"
                preserveAspectRatio="xMidYMid meet"
                role="img"
                aria-labelledby="lander-scene-title lander-scene-description"
            >
            <title id="lander-scene-title">Lunar deployment scene</title>
            <desc id="lander-scene-description">
                An AGW lander hovers above a varied lunar surface, an elevated helipad with a gas can, and a dark
                network operations center.
            </desc>
            <rect id="scene-sky" width="1000" height="640" />
            <path id="scene-stars" d="M90 98h2m122-31h2m235 63h2m198-48h2m173 91h2" />
            <g id="lander-world" aria-hidden="true">
                <g id="terrain-layer">
                    <path
                        class="terrain-fill"
                        fill="#d7d2c4"
                        stroke="none"
                        d="M0 505.0134163601324L100 516.334580918774L200 486.6557454774156L300 473L312 476.1557689513639L400 499.29807459469885L405 498.9141328226309L408 498.6837677593902L428 497.1480006711185L498 491.77281586216765L500 491.61923915334046L600 473L700 514.4128468879499L800 485.30965075525455L900 518.2064546225592L1000 511.10325848986395L1000 648L0 648Z"
                    />
                    <path
                        class="terrain-surface"
                        fill="none"
                        stroke="#4b4e55"
                        stroke-width="2"
                        stroke-linejoin="round"
                        d="M0 505.0134163601324L100 516.334580918774L200 486.6557454774156L300 473L312 476.1557689513639L400 499.29807459469885L405 498.9141328226309L408 498.6837677593902L428 497.1480006711185L498 491.77281586216765L500 491.61923915334046L600 473L700 514.4128468879499L800 485.30965075525455L900 518.2064546225592L1000 511.10325848986395"
                    />
                </g>
                <g id="site-layer">
                    <g class="lander-site" data-site-id="0" data-can="present" data-power="off" data-agent="absent" data-noc-stage="0">
                        <rect class="landing-platform" x="312" y="449" width="96" height="3.5" />
                        <path class="helipad-mark" d="M351 450.7v-20m18 20v-20m-18 10h18" />
                        <path class="site-scaffold" fill="none" stroke="#4b4e55" stroke-width="2" stroke-linecap="butt" stroke-linejoin="round" d="M312 452.5H498M312 460H498M312 452.5L327.5 460M327.5 460L343 452.5M343 452.5L358.5 460M358.5 460L374 452.5M374 452.5L389.5 460M389.5 460L405 452.5M405 452.5L420.5 460M420.5 460L436 452.5M436 452.5L451.5 460M451.5 460L467 452.5M467 452.5L482.5 460M482.5 460L498 452.5M312 460V476.1557689513639M405 460V498.9141328226309M498 460V491.77281586216765" />
                        <path
                            class="gas-can"
                            transform="translate(390 434)"
                            d="M-7 0h14v15H-7Zm4-5h7v5h-7Zm10 7h4v8H7"
                        />
                        <path class="noc-building" d="M428 452.5V377h70V452.5Z" />
                        <path class="noc-building noc-entry" d="M 428 431 H 441 V 449 H 428 Z" />
                        <g class="noc-battery">
                            <rect x="452" y="393" width="22" height="40" />
                            <path class="battery-bar battery-bar-1" d="M457 423h12v5h-12Z" />
                            <path class="battery-bar battery-bar-2" d="M457 415h12v5h-12Z" />
                            <path class="battery-bar battery-bar-3" d="M457 407h12v5h-12Z" />
                            <path class="battery-bar battery-bar-4" d="M457 399h12v5h-12Z" />
                        </g>
                        <path class="noc-antenna antenna-mast" d="M463 377v-32" />
                        <circle class="noc-antenna antenna-head" cx="463" cy="343" r="4" />
                        <path class="noc-antenna antenna-signal antenna-signal-1" d="M455 339Q463 331 471 339" />
                        <path class="noc-antenna antenna-signal antenna-signal-2" d="M448 338Q463 323 478 338" />
                        <path class="noc-antenna antenna-signal antenna-signal-3" d="M440 337Q463 314 486 337" />
                    </g>
                </g>
                <g id="debris-layer"></g>
                <g id="mission-lander">
                    <use id="mission-left-engine" href="{{SITE_BASE}}assets/agw-rocket.svg#agw-engine-left" />
                    <use id="mission-right-engine" href="{{SITE_BASE}}assets/agw-rocket.svg#agw-engine-right" />
                    <use id="mission-mark" href="{{SITE_BASE}}assets/agw-rocket.svg#agw-mark" />
                    <path id="mission-bay-lip" d="M126 248h52v12h-52" />
                </g>
                <g id="mission-agent">
                    <rect x="-5" y="-9" width="10" height="11" rx="1" />
                    <path d="M-3 2v7m6-7v7M-2-5l2 2-2 2m3 0h2" />
                </g>
            </g>
            <g id="crash-flash" aria-hidden="true"><ellipse cx="0" cy="0" rx="16" ry="9" /></g>
            <g id="next-site-cue" aria-hidden="true" transform="translate(932 280)">
                <path d="M0 14h24V4l20 18-20 18V30H0Z" />
            </g>
            </svg>
            <button id="lander-start" type="button" hidden disabled aria-label="Start lunar deployment mission"></button>
            <p id="lander-fuel" hidden>
                <span id="lander-fuel-gauge" aria-hidden="true"><span id="lander-fuel-gauge-fill"></span></span>
                <span id="lander-fuel-label" class="visually-hidden">Fuel reserve:</span>
                <span id="lander-fuel-value" class="visually-hidden">0.0</span>
            </p>
            <span id="lander-target-direction" class="visually-hidden" hidden>Next site is to the right.</span>
            <div id="lander-outcome" hidden>
                <p id="lander-status" role="status" aria-live="polite" aria-atomic="true"></p>
                <button id="lander-restart" type="button" hidden disabled aria-keyshortcuts="r">
                    <span class="lander-action-label">Retry</span>
                    <span class="lander-key-hint" aria-hidden="true">r</span>
                </button>
            </div>
        </div>
        <div id="lander-controls-rail" hidden>
            <p id="lander-controls">
                <span class="lander-controls-line lander-controls-keyboard">Space/Up thrust; Left/H or Right/L turn.</span>
                <span class="lander-controls-line lander-controls-touch">Touch: tap/hold to thrust; drag to turn.</span>
            </p>
            <button id="lander-exit" type="button" disabled aria-keyshortcuts="Escape">
                <span class="lander-action-label">Exit mission</span>
                <span class="lander-key-hint" aria-hidden="true">&lt;esc&gt;</span>
            </button>
        </div>
    </div>
</section>
