<section id="lander-game" aria-label="Lunar deployment scene">
    <div id="lander-scene-shell" tabindex="-1">
        <svg
            id="lander-scene"
            viewBox="0 0 1000 640"
            preserveAspectRatio="xMidYMid meet"
            role="img"
            aria-labelledby="lander-scene-title lander-scene-description"
        >
            <title id="lander-scene-title">Lunar deployment scene</title>
            <desc id="lander-scene-description">
                An AGW lander hovers above a varied lunar surface, an elevated helipad with a gas can, and a dark
                network operations center.
            </desc>
            <rect id="scene-sky" width="1000" height="640" />
            <path id="scene-stars" d="M90 98h2m122-31h2m235 63h2m198-48h2m173 91h2" />
            <g id="lander-world" aria-hidden="true">
                <g id="terrain-layer">
                    <path
                        class="terrain-chunk"
                        data-chunk-index="0"
                        d="M0 505.0134163601324L100 516.334580918774L200 486.6557454774156L300 473L312 476.1557689513639L498 476.1557689513639L500 491.61923915334046L500 648L0 648Z"
                    />
                </g>
                <g id="site-layer">
                    <g class="lander-site" data-site-id="0" data-can="present" data-power="off" data-noc-stage="0">
                        <rect class="landing-platform" x="312" y="468.1557689513639" width="96" height="3.5" />
                        <path class="helipad-mark" d="M351 469.8557689513639v-20m18 20v-20m-18 10h18" />
                        <path class="platform-supports" d="M312 471.6557689513639H408V476.1557689513639H312ZM312 471.6557689513639L328 476.1557689513639M312 476.1557689513639L328 471.6557689513639M328 471.6557689513639L344 476.1557689513639M328 476.1557689513639L344 471.6557689513639M344 471.6557689513639L360 476.1557689513639M344 476.1557689513639L360 471.6557689513639M360 471.6557689513639L376 476.1557689513639M360 476.1557689513639L376 471.6557689513639M376 471.6557689513639L392 476.1557689513639M376 476.1557689513639L392 471.6557689513639M392 471.6557689513639L408 476.1557689513639M392 476.1557689513639L408 471.6557689513639" />
                        <path
                            class="gas-can"
                            transform="translate(390 453.1557689513639)"
                            d="M-7 0h14v15H-7Zm4-5h7v5h-7Zm10 7h4v8H7"
                        />
                        <path class="noc-building" d="M428 476.1557689513639V396.1557689513639h70V476.1557689513639Z" />
                        <path class="noc-building noc-entry" d="M428 450.1557689513639h13v18h-13Z" />
                        <g class="noc-battery">
                            <rect x="452" y="412.1557689513639" width="22" height="40" rx="2" />
                            <path class="battery-terminal" d="M458 412.1557689513639v-6h10v6" />
                            <path class="battery-bar battery-bar-1" d="M457 442.1557689513639h12v5h-12Z" />
                            <path class="battery-bar battery-bar-2" d="M457 434.1557689513639h12v5h-12Z" />
                            <path class="battery-bar battery-bar-3" d="M457 426.1557689513639h12v5h-12Z" />
                            <path class="battery-bar battery-bar-4" d="M457 418.1557689513639h12v5h-12Z" />
                        </g>
                        <path class="noc-antenna antenna-mast" d="M463 396.1557689513639v-32" />
                        <circle class="noc-antenna antenna-head" cx="463" cy="362.1557689513639" r="4" />
                        <path
                            class="noc-antenna antenna-signal"
                            d="M472 358.1557689513639a15 15 0 0 1 0 16m8-24a26 26 0 0 1 0 32"
                        />
                    </g>
                </g>
                <g id="debris-layer"></g>
                <g id="mission-lander">
                    <use id="mission-left-engine" href="{{SITE_BASE}}assets/agw-rocket.svg#agw-engine-left" />
                    <use id="mission-right-engine" href="{{SITE_BASE}}assets/agw-rocket.svg#agw-engine-right" />
                    <use id="mission-mark" href="{{SITE_BASE}}assets/agw-rocket.svg#agw-mark" />
                    <path id="mission-bay-lip" d="M126 248h52v12h-52" />
                </g>
                <g id="mission-agent">
                    <rect x="-5" y="-9" width="10" height="11" rx="1" />
                    <path d="M-3 2v7m6-7v7M-2-5l2 2-2 2m3 0h2" />
                </g>
            </g>
            <g id="crash-flash" aria-hidden="true"><ellipse cx="0" cy="0" rx="16" ry="9" /></g>
            <g id="next-site-cue" aria-hidden="true" transform="translate(932 280)">
                <path d="M0 14h24V4l20 18-20 18V30H0Z" />
            </g>
        </svg>
        <button id="lander-start" type="button" hidden disabled aria-label="Start lunar deployment mission"></button>
    </div>
    <p id="lander-fuel" hidden>
        <span id="lander-fuel-label">Fuel reserve</span>:
        <output id="lander-fuel-value" aria-labelledby="lander-fuel-label">0.0</output>
    </p>
    <span id="lander-target-direction" class="visually-hidden" hidden>Next site is to the right.</span>
    <p id="lander-controls" hidden>
        Thrust: Space or Up. Turn: Left/H or Right/L. Tap or hold to thrust; drag to turn. R restarts after a crash.
        Escape exits.
    </p>
    <div id="lander-actions" hidden>
        <button id="lander-exit" type="button">Exit mission</button>
        <button id="lander-restart" type="button" hidden disabled>Restart mission</button>
    </div>
    <p id="lander-status" role="status" aria-live="polite" aria-atomic="true"></p>
</section>
