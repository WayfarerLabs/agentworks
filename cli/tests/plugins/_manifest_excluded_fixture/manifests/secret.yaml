# A fixture bundling a `secret`, an EXCLUDED kind (not in PLUGIN_MANIFEST_KINDS:
# its consumption path is not gated by Phase 7). Publication must reject it so
# no ungated disabled-plugin resource is reachable (Phase 7, LLD c 3b.2).
apiVersion: agentworks/v1
kind: secret
metadata:
  name: fixture-secret
  description: A fixture secret shipped by a system plugin (an unbundleable kind)
spec:
  backend_mappings:
    env-var: FIXTURE_SECRET
