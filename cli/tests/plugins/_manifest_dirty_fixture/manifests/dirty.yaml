# A DIRTY bundle: an AGENTWORKS_* env key is a load-time ADVISORY (the
# runtime prelude overrides it), so `load_manifests` collects a spec-level
# issue rather than raising. That is what exercises
# `publish_manifest_package`'s issues-to-ConfigError path (the
# assert-to-raise migration), not the loader's own hard errors.
apiVersion: agentworks/v1
kind: vm-template
metadata:
  name: fixture-dirty-template
  description: triggers a warn-level issue via an overridden identity variable
spec:
  env:
    AGENTWORKS_VM: override
