# The codex system plugin's bundled example session-templates: a small posture
# ladder for Codex sessions, from most to least restricted.
#
# There are three ways to use them:
#   1. Use them as-is, by name, in your own session-template spec.
#   2. Inherit from one, adding your own session-template settings (env, etc.).
#   3. Copy them into your own resources/ directory and adjust as you see fit.
#
# To start a session from one on a stock VM, the agent also needs the Codex
# CLI installed. The plugin ships a paired example agent-template,
# `example-codex`, that installs it; compose the two:
#   agw session create <name> --template example-codex-strict \
#       --new-agent --agent-template example-codex
#
# Like every plugin-bundled resource, they publish present-but-disabled until
# an operator opts in with `[plugins] system = ["codex"]`.
#
# Posture is expressed through Codex's own knobs (all values are Codex-owned
# and forwarded unvalidated):
#   sandbox         -> read-only | workspace-write | danger-full-access
#   approval_policy -> untrusted | on-request | never
#   network         -> whether the sandbox may reach the network
#   web_search      -> whether Codex's web search tool is enabled
# The ladder:
#   strict -> read-only sandbox, no network; prompts for requests beyond it
#   auto   -> workspace-write with network; prompts for requests beyond it
#   yolo   -> full access, no approvals, web search on
apiVersion: agentworks/v1
kind: session-template
metadata:
  name: example-codex-strict
  description: "Codex, strict posture: read-only sandbox, prompts for requests beyond it"
spec:
  harness:
    name: codex
    sandbox: read-only
    approval_policy: on-request
---
apiVersion: agentworks/v1
kind: session-template
metadata:
  name: example-codex-auto
  description: "Codex, auto posture: writes the workspace with network access, prompts for requests beyond the sandbox"
spec:
  harness:
    name: codex
    sandbox: workspace-write
    approval_policy: on-request
    network: true
---
apiVersion: agentworks/v1
kind: session-template
metadata:
  name: example-codex-yolo
  description: "Codex, yolo posture: full access, no approvals, web search on"
spec:
  harness:
    name: codex
    sandbox: danger-full-access
    approval_policy: never
    web_search: true
