# The claude system plugin's bundled example session-templates: a small
# posture ladder for Claude Code sessions, from most to least restricted.
#
# There are three ways to use them:
#   1. Use them as-is, by name, in your own session-template spec.
#   2. Inherit from one, adding your own session-template settings (env, etc.).
#   3. Copy them into your own resources/ directory and adjust as you see fit.
#
# Like every plugin-bundled resource, they publish present-but-disabled until
# an operator opts in with `[plugins] system = ["claude"]`.
#
# Posture is expressed through Claude Code's own `permission_mode` (forwarded
# to `claude --permission-mode`; the value set is Claude-owned and forwarded
# unvalidated). This ladder uses three of the modes:
#   strict -> default           (prompts before each action, no auto-accepts)
#   auto   -> auto              (actions auto-approved based on a classifier)
#   yolo   -> bypassPermissions (skips every permission prompt)
# Other values work too: for example `plan`, which goes straight into plan mode
# and never makes an edit, or `acceptEdits`, which auto-accepts edits but still
# prompts for other actions.
apiVersion: agentworks/v1
kind: session-template
metadata:
  name: example-claude-strict
  description: "Claude Code, strict posture: prompts before each action (default mode)"
spec:
  harness:
    name: claude-code
    permission_mode: default
---
apiVersion: agentworks/v1
kind: session-template
metadata:
  name: example-claude-auto
  description: "Claude Code, auto posture: actions auto-approved by a classifier (auto mode)"
spec:
  harness:
    name: claude-code
    permission_mode: auto
---
apiVersion: agentworks/v1
kind: session-template
metadata:
  name: example-claude-yolo
  description: "Claude Code, yolo posture: skips every permission prompt (bypassPermissions)"
spec:
  harness:
    name: claude-code
    permission_mode: bypassPermissions
