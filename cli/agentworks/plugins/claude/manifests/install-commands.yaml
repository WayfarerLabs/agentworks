# The claude system plugin's bundled install-command: the Claude Code CLI,
# a user-install-command (per-user, run for each user). Moved out of
# manifests/builtin/install-commands.yaml when the claude bundle migrated to
# a system plugin (Phase 9). Published present-but-disabled until an operator
# opts in with `[plugins] system = ["claude"]`; a template that references it
# while claude is not enabled is gated with the enable hint, not an
# unknown-name error (Phase 7 manifest parity).
apiVersion: agentworks/v1
kind: user-install-command
metadata:
  name: claude
  description: Claude Code CLI
spec:
  command: "curl -fsSL https://claude.ai/install.sh | bash"
  path:
    - ~/.local/bin
  test_exec: claude
