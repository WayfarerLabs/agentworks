# The azure system plugin's bundled install-command: the Azure CLI, a
# system-install-command (system-wide, run once per VM as root; consumed by VM
# init). Moved out of manifests/builtin/install-commands.yaml when the azure
# bundle migrated to a system plugin (Phase 11). Published present-but-disabled
# until an operator opts in with `[plugins] system = ["azure"]`; a vm-template
# that references it while azure is not enabled is gated with the enable hint,
# not an unknown-name error (Phase 7 manifest parity).
apiVersion: agentworks/v1
kind: system-install-command
metadata:
  name: az-cli
  description: Azure CLI
spec:
  command: "curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash"
  test_exec: az
