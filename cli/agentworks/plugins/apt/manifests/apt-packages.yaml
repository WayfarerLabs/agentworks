# Optional apt package sets published by the `apt` system plugin. Each
# `spec.apt_sources` entry resolves to an apt-source resource that is installed
# before the packages.
apiVersion: agentworks/v1
kind: apt-package
metadata:
  name: gh
  description: GitHub CLI
spec:
  apt_sources:
    - github-cli
  apt:
    - gh
---
apiVersion: agentworks/v1
kind: apt-package
metadata:
  name: terraform
  description: HashiCorp Terraform
spec:
  apt_sources:
    - hashicorp
  apt:
    - terraform
---
apiVersion: agentworks/v1
kind: apt-package
metadata:
  name: nodejs
  description: Node.js 22.x via NodeSource
spec:
  apt_sources:
    - nodesource-v22
  apt:
    - nodejs
---
apiVersion: agentworks/v1
kind: apt-package
metadata:
  name: ngrok
  description: ngrok reverse tunnel agent
spec:
  apt_sources:
    - ngrok-agent
  apt:
    - ngrok
---
apiVersion: agentworks/v1
kind: apt-package
metadata:
  name: tenv
  description: tenv (Terraform/OpenTofu/Terragrunt version manager)
spec:
  apt_sources:
    - tofuutils-tenv
  apt:
    - tenv
