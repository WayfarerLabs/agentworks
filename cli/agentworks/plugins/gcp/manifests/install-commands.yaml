# Optional guest tooling. GCE lifecycle uses the Python SDK and does not call
# or authenticate gcloud. Normal VM initialization uses the fixed system
# locations required by Google's signed apt repository.
# System install commands do not inherit administrator privileges, so every
# mutation of a system path and every apt invocation elevates explicitly.
apiVersion: agentworks/v1
kind: system-install-command
metadata:
  name: gcloud-cli
  description: Google Cloud CLI
spec:
  test_exec: gcloud
  command: |
    set -eu
    keyring="/usr/share/keyrings/cloud.google.gpg"
    source_file="/etc/apt/sources.list.d/google-cloud-sdk.list"
    source_entry="deb [signed-by=${keyring}] https://packages.cloud.google.com/apt cloud-sdk main"
    temp_root="$(mktemp -d)"
    trap 'rm -rf "$temp_root"' EXIT
    trap 'exit 129' HUP
    trap 'exit 130' INT
    trap 'exit 143' TERM
    key_tmp="$temp_root/cloud.google.gpg"
    source_tmp="$temp_root/google-cloud-sdk.list"
    curl --fail --silent --show-error https://packages.cloud.google.com/apt/doc/apt-key.gpg | \
      gpg --dearmor --yes --output "$key_tmp"
    sudo install -d -m 0755 "$(dirname "$keyring")" "$(dirname "$source_file")"
    sudo install -m 0644 "$key_tmp" "$keyring"
    printf '%s\n' "$source_entry" > "$source_tmp"
    sudo tee "$source_file" < "$source_tmp" > /dev/null
    sudo chmod 0644 "$source_file"
    sudo apt-get update -y
    sudo env CLOUDSDK_SKIP_PY_COMPILATION=1 apt-get install -y google-cloud-cli
