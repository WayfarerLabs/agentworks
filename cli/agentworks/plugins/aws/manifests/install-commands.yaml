    E91G7bb0hOb/cA==
    =knv7
    -----END PGP PUBLIC KEY BLOCK-----
    AWS_CLI_TEAM_KEY
    GNUPGHOME="$gnupg_home" gpg --batch --import "$key_path"
    primary_fingerprint="$(GNUPGHOME="$gnupg_home" gpg --batch --with-colons --fingerprint --list-keys | awk -F: '$1 == "pub" {primary = 1; next} primary && $1 == "fpr" {print $10; exit}')"
    test "$primary_fingerprint" = "FB5DB77FD5C118B80511ADA8A6310ACC4672475C"
    GNUPGHOME="$gnupg_home" gpg --batch --verify "$signature_path" "$archive_path"
    unzip -q "$archive_path" -d "$temp_root"
    # Recheck ownership and state immediately before the privileged boundary. A
    # collision that appeared while the archive was downloading must not be removed,
    # and the install mode must describe the current layout rather than a stale one.
    classify_layout
    if test "$install_mode" = "update"; then
      sudo "$temp_root/aws/install" --install-dir "$install_dir" --bin-dir "$bin_dir" --update
    else
      if test "$install_mode" = "reinstall"; then
        sudo rm -rf -- "$install_dir"
        sudo rm -f -- "$aws_link" "$completer_link"
      fi
      sudo "$temp_root/aws/install" --install-dir "$install_dir" --bin-dir "$bin_dir"
    fi
    layout_complete=1
    if ! test -d "$install_dir" || test -L "$install_dir"; then layout_complete=0; fi
    if ! inspect_launcher "$aws_link" "$aws_target" || ! test -L "$aws_link"; then layout_complete=0; fi
    if ! inspect_launcher "$completer_link" "$completer_target" || ! test -L "$completer_link"; then
      layout_complete=0
    fi
    if ! test -f "$aws_target" || ! test -x "$aws_target" \
      || ! test -f "$completer_target" || ! test -x "$completer_target"; then
      layout_complete=0
    fi
    if test "$layout_complete" -ne 1; then
      echo "AWS CLI installer did not produce the expected managed layout" >&2
      exit 1
    fi
