    AWS_CLI_TEAM_KEY
    GNUPGHOME="$gnupg_home" gpg --batch --import "$key_path"
    primary_fingerprint="$(GNUPGHOME="$gnupg_home" gpg --batch --with-colons --fingerprint --list-keys | awk -F: '$1 == "pub" {primary = 1; next} primary && $1 == "fpr" {print $10; exit}')"
    test "$primary_fingerprint" = "FB5DB77FD5C118B80511ADA8A6310ACC4672475C"
    GNUPGHOME="$gnupg_home" gpg --batch --verify "$signature_path" "$archive_path"
    unzip -q "$archive_path" -d "$temp_root"
    if test "$managed_update" -eq 1; then
      sudo "$temp_root/aws/install" --install-dir "$install_dir" --bin-dir "$bin_dir" --update
    else
      sudo "$temp_root/aws/install" --install-dir "$install_dir" --bin-dir "$bin_dir"
    fi
    if ! test -x "$public_launcher" || ! test -x "$managed_binary"; then
      echo "AWS CLI v2 installer did not produce both managed executables" >&2
      exit 1
    fi
    sudo install -m 0644 /dev/null "$completion_marker"
