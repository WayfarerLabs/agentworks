# Optional guest tooling. EC2 lifecycle uses boto3 and does not call or
# authenticate aws. This recipe runs on every init and reinit so the official
# installer can reconcile the Agentworks-owned installation under /usr/local/lib.
# Download and signature verification remain unprivileged. Only reserved-layout
# repair and the official system installer explicitly elevate because install
# commands are not root.
apiVersion: agentworks/v1
kind: system-install-command
metadata:
  name: aws-cli
  description: AWS CLI v2
spec:
  command: |
    set -eu
    install_dir="/usr/local/lib/agentworks/aws-cli"
    bin_dir="/usr/local/bin"
    aws_link="$bin_dir/aws"
    completer_link="$bin_dir/aws_completer"
    aws_target="$install_dir/v2/current/bin/aws"
    completer_target="$install_dir/v2/current/bin/aws_completer"
    launcher_target_is_exact() {
      readlink "$1" | {
        IFS= read -r actual_target \
          && test "$actual_target" = "$2" \
          && ! IFS= read -r extra_target
      }
    }
    inspect_launcher() {
      launcher="$1"
      expected_target="$2"
      if test -L "$launcher"; then
        if ! launcher_target_is_exact "$launcher" "$expected_target"; then
          echo "AWS CLI launcher collision at $launcher" >&2
          return 1
        fi
      elif test -e "$launcher"; then
        echo "AWS CLI launcher collision at $launcher" >&2
        return 1
      fi
    }
    classify_layout() {
      inspect_launcher "$aws_link" "$aws_target"
      inspect_launcher "$completer_link" "$completer_target"
      aws_link_present=0
      completer_link_present=0
      managed_present=0
      test -L "$aws_link" && aws_link_present=1
      test -L "$completer_link" && completer_link_present=1
      if test -e "$install_dir" || test -L "$install_dir"; then managed_present=1; fi
      install_mode="reinstall"
      if test -d "$install_dir" && ! test -L "$install_dir" \
        && test "$aws_link_present" -eq 1 && test "$completer_link_present" -eq 1 \
        && test -f "$aws_target" && test -x "$aws_target" \
        && test -f "$completer_target" && test -x "$completer_target"; then
        install_mode="update"
      elif test "$managed_present" -eq 0 \
        && test "$aws_link_present" -eq 0 && test "$completer_link_present" -eq 0; then
        install_mode="fresh"
      fi
    }
    classify_layout
    case "$(uname -m)" in
      x86_64) archive="awscli-exe-linux-x86_64.zip" ;;
      aarch64) archive="awscli-exe-linux-aarch64.zip" ;;
      *) echo "AWS CLI v2 is unsupported on architecture $(uname -m)" >&2; exit 1 ;;
    esac
    temp_root="$(mktemp -d)"
    gnupg_home="$temp_root/gnupg"
    trap 'rm -rf "$temp_root"' EXIT
    trap 'exit 129' HUP
    trap 'exit 130' INT
    trap 'exit 143' TERM
    mkdir -m 0700 "$gnupg_home"
    archive_path="$temp_root/awscliv2.zip"
    signature_path="$archive_path.sig"
    key_path="$temp_root/aws-cli-team.asc"
    curl --fail --silent --show-error "https://awscli.amazonaws.com/$archive" -o "$archive_path"
    curl --fail --silent --show-error "https://awscli.amazonaws.com/$archive.sig" -o "$signature_path"
    # Refresh the block whenever AWS republishes signing material (for example, a renewed
    # self-signature or changed subkeys); change the pinned fingerprint only when the primary key rotates.
    cat > "$key_path" <<'AWS_CLI_TEAM_KEY'
    -----BEGIN PGP PUBLIC KEY BLOCK-----

    mQINBF2Cr7UBEADJZHcgusOJl7ENSyumXh85z0TRV0xJorM2B/JL0kHOyigQluUG
    ZMLhENaG0bYatdrKP+3H91lvK050pXwnO/R7fB/FSTouki4ciIx5OuLlnJZIxSzx
    PqGl0mkxImLNbGWoi6Lto0LYxqHN2iQtzlwTVmq9733zd3XfcXrZ3+LblHAgEt5G
    TfNxEKJ8soPLyWmwDH6HWCnjZ/aIQRBTIQ05uVeEoYxSh6wOai7ss/KveoSNBbYz
    gbdzoqI2Y8cgH2nbfgp3DSasaLZEdCSsIsK1u05CinE7k2qZ7KgKAUIcT/cR/grk
    C6VwsnDU0OUCideXcQ8WeHutqvgZH1JgKDbznoIzeQHJD238GEu+eKhRHcz8/jeG
    94zkcgJOz3KbZGYMiTh277Fvj9zzvZsbMBCedV1BTg3TqgvdX4bdkhf5cH+7NtWO
    lrFj6UwAsGukBTAOxC0l/dnSmZhJ7Z1KmEWilro/gOrjtOxqRQutlIqG22TaqoPG
    fYVN+en3Zwbt97kcgZDwqbuykNt64oZWc4XKCa3mprEGC3IbJTBFqglXmZ7l9ywG
    EEUJYOlb2XrSuPWml39beWdKM8kzr1OjnlOm6+lpTRCBfo0wa9F8YZRhHPAkwKkX
