# Optional guest tooling. EC2 lifecycle uses boto3 and does not call or
# authenticate aws. Snap owns installation and automatic refresh; the
# completion check avoids repeating an already-complete classic install.
apiVersion: agentworks/v1
kind: system-install-command
metadata:
  name: aws-cli
  description: AWS CLI v2 from the Snap Store
spec:
  command: sudo snap install aws-cli --classic
  test_file: /snap/bin/aws
