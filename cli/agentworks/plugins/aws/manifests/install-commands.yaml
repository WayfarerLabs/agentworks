# Optional guest tooling. EC2 lifecycle uses boto3 and does not call or
# authenticate aws. The runner requires Agentworks' public launcher plus a
# command-owned completion marker; the command also validates the internal
# managed binary or accepts an external v2 discovered on PATH.
# Download and signature verification remain unprivileged; only the final
# system installation explicitly elevates because install commands are not root.
apiVersion: agentworks/v1
kind: system-install-command
metadata:
  name: aws-cli
  description: AWS CLI v2
spec:
  test_exec: /usr/local/bin/aws
  test_file: /usr/local/aws-cli/.agentworks-v2-complete
  command: |
    set -eu
    install_dir="/usr/local/aws-cli"
    bin_dir="/usr/local/bin"
    completion_marker="$install_dir/.agentworks-v2-complete"
    public_launcher="$bin_dir/aws"
    managed_binary="$install_dir/v2/current/bin/aws"
    if test -f "$completion_marker" && test -x "$public_launcher" && test -x "$managed_binary"; then
      exit 0
    fi
    managed_update=0
    if test -e "$install_dir" || test -L "$install_dir"; then
      sudo rm -f -- "$completion_marker"
      managed_update=1
    elif command -v aws >/dev/null 2>&1 && aws --version 2>&1 | grep -q '^aws-cli/2\.'; then
      exit 0
    fi
    case "$(uname -m)" in
      x86_64) archive="awscli-exe-linux-x86_64.zip" ;;
      aarch64) archive="awscli-exe-linux-aarch64.zip" ;;
      *) echo "AWS CLI v2 is unsupported on architecture $(uname -m)" >&2; exit 1 ;;
    esac
    temp_root="$(mktemp -d)"
    gnupg_home="$temp_root/gnupg"
    trap 'rm -rf "$temp_root"' EXIT
    trap 'exit 129' HUP
    trap 'exit 130' INT
    trap 'exit 143' TERM
    mkdir -m 0700 "$gnupg_home"
    archive_path="$temp_root/awscliv2.zip"
    signature_path="$archive_path.sig"
    key_path="$temp_root/aws-cli-team.asc"
    curl --fail --silent --show-error "https://awscli.amazonaws.com/$archive" -o "$archive_path"
    curl --fail --silent --show-error "https://awscli.amazonaws.com/$archive.sig" -o "$signature_path"
    # Refresh the block whenever AWS republishes signing material (for example, a renewed
    # self-signature or changed subkeys); change the pinned fingerprint only when the primary key rotates.
    cat > "$key_path" <<'AWS_CLI_TEAM_KEY'
    -----BEGIN PGP PUBLIC KEY BLOCK-----

    mQINBF2Cr7UBEADJZHcgusOJl7ENSyumXh85z0TRV0xJorM2B/JL0kHOyigQluUG
