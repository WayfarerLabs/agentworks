## kind: admin-template -- per-user settings for the admin (operator)
## user on VMs, applied during init/reinit. There is exactly one; the
## envelope accepts only the name `default`.
## The `git_credentials: [github]` reference pairs with the
## git-credential sample. Declare that resource too (or drop the field),
## or loading will fail on the missing reference.
## The commented claude_marketplaces / claude_plugins lines install
## Claude Code marketplace plugins for this user (needs the `claude`
## CLI on PATH); see "Claude Code Plugins" in cli/README.md.
##
#apiVersion: agentworks/v1
#kind: admin-template
#metadata:
#  name: default
#spec:
#  username: agentworks
#  shell: zsh
#  git_credentials: [github]
#  user_install_commands: [bun]
#  dotfiles_source: git::https://github.com/user/dotfiles
#  # dotfiles_destination: ~/.dotfiles   # where to put them on the VM
#  # dotfiles_install_cmd: ./install.sh  # command to run after clone/copy
#  mise_activate: true
#  # git_force_safe_directory: true      # set safe.directory '*' for admin and agents (default true)
#  # claude_marketplaces: ["https://github.com/WayfarerLabs/nerftools#4.1.0"]
#  # claude_plugins: [nerftools-default@nerftools]
#  env:
#    EDITOR: nvim
