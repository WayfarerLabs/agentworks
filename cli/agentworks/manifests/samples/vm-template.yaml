## kind: vm-template -- system-level VM configuration: hardware
## resources, system packages, and system-wide tools. Selected at
## `agw vm create` time with --template; the `default` template applies
## when --template is omitted. Templates inherit via `inherits` (child
## values win, depth-first left-to-right).
##
#apiVersion: agentworks/v1
#kind: vm-template
#metadata:
#  name: dev
#spec:
#  inherits: [default]
#  cpus: 8
#  memory: 16
#  disk: 100
#  swap: 4                          # swap file size in GiB (0 to disable)
#  apt: [zsh, ripgrep]
#  apt_packages: [gh]
#  # snap: [go]                     # direct snap packages
#  system_install_commands: [az-cli]
#  # Name of the secret whose value is used as the Tailscale auth key
#  # during `vm create` / `vm reinit`, resolved through the backend
#  # chain. Bare secret name only; the default is tailscale-auth-key.
#  # tailscale_auth_key: tailscale-auth-key
#  env:
#    HTTP_PROXY: http://proxy:3128
#    NPM_TOKEN: {secret: npm-token}
