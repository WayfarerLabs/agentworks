## kind: session-template: selects the harness integration that runs a
## session's workload. A session is a specification to run a specific workload
## (an agentic harness or a shell) through an integration as an agent in a workspace on a VM. The integration
## owns start/restart and the launch-target readiness check.
## `spec.harness_integration` is one tagged table: its `name` key selects the
## integration capability and the remaining keys are the config that
## integration validates. The old `harness` / `harness_config` inputs still
## load with a deprecation warning through 0.13.0. An undeclared integration
## resolves to `shell` (a plain login shell), so a
## field-less template is still a login shell.
##
## `shell`'s config vocabulary is the legacy command fields, now nested:
##   command:           the pane command (empty/omitted = login shell)
##   resume_command:    used by `agw session resume`; falls back to command
##   required_commands: executables checked on the launch target first
## Commands support the {{session_name}} and {{workspace_name}} variables.
## Env maps merge during inheritance (child wins); required_commands union.
##
#apiVersion: agentworks/v1
#kind: session-template
#metadata:
#  name: htop
#  description: Live process monitor
#spec:
#  harness_integration:
#    name: shell
#    command: htop
#    required_commands: [htop]
#  env:
#    TERM: xterm-256color
##
## Note that it is possible to tap into a harness' resume semantics purely
## through the shell integration and careful construction of the
## command/resume_command pair. For example, the following generally works
## with Claude Code. That said, the harness integrations are much more robust
## and full-featured. This is merely provided as an example of how to use the
## shell integration to run a harness without a dedicated integration.
##
#apiVersion: agentworks/v1
#kind: session-template
#metadata:
#  name: claude-via-shell
#  description: Run Claude Code with resume through the shell integration
#spec:
#  harness_integration:
#    name: shell
#    required_commands: [claude]
#    command: claude --name {{session_name}}
#    resume_command: claude --resume {{session_name}}
##
## The `claude-code` integration runs Claude Code as the session workload. It ships as the
## opt-in `claude` system plugin, so enable it with `[plugins] system =
## ["claude"]` (otherwise creating a session on this template is refused with an
## "enable plugin `claude`" hint). It selects the launch/resume conventions with
## one table (`harness_integration: {name: claude-code}`) instead of restating command
## strings: `session create` starts a new Claude session and `session resume`
## resumes the same conversation when its transcript still exists. Its config
## is three optional fields:
##   permission_mode: forwarded to `claude --permission-mode`
##   model:           forwarded to `claude --model`
##   extra_args:      raw argv tokens appended last (the escape hatch)
## The only launch-target requirement is that `claude` is installed.
##
#---
#apiVersion: agentworks/v1
#kind: session-template
#metadata:
#  name: claude
#  description: Session running Claude Code through its harness integration
#spec:
#  harness_integration:
#    name: claude-code
#    permission_mode: acceptEdits
#    model: opus
##
## The `codex` integration runs Codex the same way. It ships as the opt-in `codex`
## system plugin (enable it with `[plugins] system = ["codex"]`). `session
## create` starts a new Codex session; `session resume` resumes the same
## conversation once Codex has recorded a turn in it (Codex mints its own ids, so
## the integration learns this session's from Codex itself, and opens Codex's own
## session picker in the pane when it genuinely cannot tell). Its config is
## ten optional fields:
##   model:                  forwarded to `codex -m`
##   sandbox:                forwarded to `codex -s`
##   network:                bool; sandbox network access (Codex defaults it OFF
##                           even in workspace-write; coding sessions usually want true)
##   web_search:             bool; enables the live web-search tool (`codex --search`)
##   approval_policy:        forwarded to `codex -a`
##   approvals_reviewer:     who adjudicates approval escalations (sandbox escapes,
##                           blocked network): `user` (default) prompts the human in
##                           the pane; `auto_review` lets Codex's risk-based reviewer
##                           subagent approve or deny instead (the sandbox still
##                           enforces the outer boundary)
##   profile:                forwarded to `codex -p`
##   writable_dirs:          extra writable directories (`codex --add-dir` each;
##                           union-merged across template inheritance)
##   disable_strict_config:  bool; the integration normally passes `--strict-config` to Codex,
##                           which ensures that we fail loudly if we have bad or drifted config
##                           keys. This flag set to 'true' removes that default flag.
##   extra_args:             raw argv tokens appended last (the escape hatch)
## The only launch-target requirement is that `codex` is installed.
##
#---
#apiVersion: agentworks/v1
#kind: session-template
#metadata:
#  name: codex
#  description: Session running Codex through its harness integration with an auto-ish posture
#spec:
#  harness_integration:
#    name: codex
#    sandbox: workspace-write
#    approval_policy: on-request
#    approvals_reviewer: auto_review
#    network: true
##
## Run `agw resource list --kind harness-integration --include-disabled` to see
## the harness integrations available in your installation.
