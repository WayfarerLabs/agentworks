## to nothing unless explicitly configured. The per-user dotfiles
## fields (dotfiles_source / dotfiles_destination / dotfiles_install_cmd)
## work here exactly as in the admin-template sample, as do the Claude
## Code plugin fields (claude_marketplaces / claude_plugins); see
