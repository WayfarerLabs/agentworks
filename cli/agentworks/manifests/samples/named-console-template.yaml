## kind: named-console-template -- settings for named multi-session
## consoles created via `agw console create`. There is exactly one; the
## envelope accepts only the name `default`. The workspace-console
## template generator does not read these values.
##
## tmux_layout is the layout applied to every multi-pane session window
## in a named console. Most values map 1:1 to tmux's built-in
## select-layout names, so the same value can be applied on the fly via
## `tmux select-layout` key bindings; `aw-session-vertical` is an
## agentworks-specific layout computed per-window from live tmux
## dimensions. The value is re-read on every build / recreate /
## add-shell / restore-session, so changing it and running
## `agw console attach <name> --recreate` (or adding or restoring a
## shell on a live console) is enough to switch layouts.
##
## Valid tmux_layout values:
##   aw-session-vertical  - single column; the session pane takes the
##                          top 50% and shell panes stack vertically in
##                          the bottom 50% with equal heights. The
##                          default, and the layout the named-console
##                          feature was designed around (one privileged
##                          session pane, helper shells underneath).
##   tiled                - roughly-equal grid
##   even-vertical        - all panes as equal-height rows (one column)
##   even-horizontal      - all panes as equal-width columns (one row)
##   main-vertical        - session pane on the left, helper shells
##                          stacked right
##   main-horizontal      - session pane on top, helper shells laid out
##                          below
## The "main" layouts treat the first pane (the session attach itself)
## as the primary; the remaining shell panes become the secondary stack.
##
#apiVersion: agentworks/v1
#kind: named-console-template
#metadata:
#  name: default
#  description: Default console layout
#spec:
#  tmux_layout: aw-session-vertical
