## kind: secret -- a named secret that env tables reference via
## { secret = "<name>" } (TOML) or {secret: <name>} (YAML). Backends
## produce the value at command time; agentworks never persists it.
## `description` is required and shown in prompts and `agw doctor`;
## `hint` (optional) is shown alongside the prompt.
## `backend_mappings.<backend>` overrides that backend's identifier for
## this one secret, or opts out with `false`.
##
## Uncomment the document lines (delete one leading `#`) and edit.
##
#apiVersion: agentworks/v1
#kind: secret
#metadata:
#  name: npm-token
#  description: npm registry token
#spec:
#  hint: Generate at https://www.npmjs.com/settings/<user>/tokens
#  backend_mappings:
#    env-var: NPM_TOKEN
##
## The onepassword backend needs an explicit per-secret address (no
## name-based default): the `op://vault/item/field` reference that
## 1Password's "Copy Secret Reference" produces (an optional
## `.../section/field` segment is allowed). The string form reads via
## op's signed-in account (or the one named by OP_ACCOUNT). To pin a
## specific account, use the table form: `reference` is the same op://
## string, `account` is an op account selector (shorthand, sign-in
## address, account ID, or user ID). onepassword ships as the opt-in
## `onepassword` system plugin; enable it with
## `[plugins] system = ["onepassword"]` in config.toml, or the mapping
## stays dormant.
##
#---
#apiVersion: agentworks/v1
#kind: secret
#metadata:
#  name: registry-password
#  description: container registry password
#spec:
#  backend_mappings:
#    onepassword: op://Work/registry/password
#    # Table form, only needed to override the default account:
#    # onepassword: {account: my.1password.com, reference: op://Work/registry/password}
